<head>
<meta charset="utf-8">

<title>电车难题</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#222;font-family:'Courier New',Consolas,monospace;color:#fff}
.wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;padding:8px}
.hud{font:bold 13px monospace;letter-spacing:2px;text-align:center;min-width:260px}
.row{display:flex;align-items:flex-end;gap:10px}
.lever{display:flex;flex-direction:column;align-items:center;gap:2px}
.lever canvas{display:block;background:#fff;border:2px solid #000}
.label{font-size:9px;letter-spacing:1px;color:#888}
.game{position:relative}
.game canvas{display:block;background:#fff;border:3px solid #000}
.ovr{position:absolute;inset:0;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#000;text-align:center;cursor:pointer}
.ovr.on{display:flex}
.ovr h1{font-size:18px;letter-spacing:3px}
.ovr p{font-size:12px;line-height:1.6;white-space:pre-line}
.ovr button{background:#000;color:#fff;border:0;padding:9px 18px;font:bold 12px monospace;cursor:pointer;letter-spacing:2px;margin-top:4px}
.ovr button:active{background:#444}
.ovr.meme{padding:0;justify-content:flex-end}
.ovr.meme img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.ovr.meme .blink{position:relative;z-index:2;background:rgba(255,255,255,.85);padding:8px 14px;font:bold 14px monospace;letter-spacing:3px;animation:blink 1s infinite;margin-bottom:18px;border:2px solid #000}
@keyframes blink{50%{opacity:.3}}
.ovr.meme .title-bar{position:absolute;top:0;left:0;right:0;background:rgba(255,255,255,.85);padding:6px;text-align:center;font:bold 13px monospace;letter-spacing:4px;border-bottom:2px solid #000;z-index:2}
.pad{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:5px}
.pad button{background:#000;color:#fff;border:0;font:bold 22px monospace;border-radius:6px;touch-action:manipulation}
.pad button:active{background:#666}
.pad .u{grid-area:1/2/2/3}.pad .l{grid-area:2/1/3/2}.pad .r{grid-area:2/3/3/4}.pad .d{grid-area:3/2/4/3}
@media (hover:none) and (pointer:coarse){.pad{display:grid}}
.tip{font:10px monospace;color:#666;letter-spacing:1px}
</style>
</head>

const C=document.getElementById('c'),X=C.getContext('2d');
const LC=document.getElementById('lc'),LX=LC.getContext('2d');
const G=12,S=24;
// hidden ending: hit left wall at the rows visually adjacent to the lever person
// (lever canvas is align:flex-end with the game canvas; person sits in the bottom area)
const SECRET_WALL_ROWS=[9,10];
const MORAL_TRIGGER_MS=10000;
const GHOST_BLINK_MS=800;
const GHOST_LIFE_MS=3800;
let snake=[{x:6,y:6},{x:5,y:6},{x:4,y:6}];
let dir={x:1,y:0},nd={x:1,y:0};
let people=[];
let score=0,combo=0,tick=0,speed=26,paused=true,alive=false;
let lastHitTime=0,moralMode=false,moralStart=0,lastGhostSpawn=0;
let countdown=0;
const rnd=n=>Math.floor(Math.random()*n);
const now=()=>Date.now();

const IMG={};
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src})}

async function loadAll(){
 IMG.trolley = await loadImg(SPRITE_DATA.trolley);
 IMG.side    = await loadImg(SPRITE_DATA.side);
 IMG.lever   = await loadImg(SPRITE_DATA.lever);
 IMG.single  = await loadImg(SPRITE_DATA.single);
 document.getElementById('splash').src = SPRITE_DATA.meme;
}

function prepareGame(){
 snake=[{x:6,y:6},{x:5,y:6},{x:4,y:6}];
 dir={x:1,y:0};nd={x:1,y:0};
 people=[];score=0;combo=0;tick=0;
 lastHitTime=now();moralMode=false;moralStart=0;lastGhostSpawn=0;
 spawnGroup();spawnGroup();
 alive=false;
}

function reset(){
 prepareGame();
 hideOvr();
 // 3-2-1-GO countdown drawn over the canvas
 paused=false;
 let n=3;countdown=n;
 const iv=setInterval(()=>{
  n--;
  if(n>0)countdown=n;
  else if(n===0)countdown=4; // 4 = "GO!"
  else{
   clearInterval(iv);
   countdown=0;
   lastHitTime=now();
   alive=true;
  }
 },700);
}

function enterMoralMode(){
 moralMode=true;
 moralStart=now();
 people=[];
 combo=0;
 lastGhostSpawn=now();
}

function moralScore(){
 if(!moralMode)return 0;
 return Math.floor((now()-moralStart)/200);
}

function spawnGhostPerson(){
 for(let i=0;i<30;i++){
  const x=rnd(G),y=rnd(G);
  if(snake.some(s=>s.x===x&&s.y===y))continue;
  if(people.some(p=>p.x===x&&p.y===y))continue;
  // avoid spawning right in front of head
  const fx=snake[0].x+dir.x, fy=snake[0].y+dir.y;
  if(x===fx&&y===fy)continue;
  people.push({x,y,ghost:true,spawnTime:now()});
  return;
 }
}

function reapGhosts(){
 if(!moralMode)return;
 const t=now();
 people=people.filter(p=>!p.ghost||(t-p.spawnTime)<GHOST_LIFE_MS);
}

function ghostAlpha(p){
 if(!p.ghost)return 1;
 const t=now()-p.spawnTime;
 if(t<GHOST_BLINK_MS){
  // blink: 200ms on/off
  return Math.floor(t/200)%2===0?0.55:0.05;
 }
 return 1;
}

function ghostSolid(p){
 if(!p.ghost)return true;
 const t=now()-p.spawnTime;
 return t>=GHOST_BLINK_MS && t<GHOST_LIFE_MS;
}

function spawnGroup(){
 const cluster=Math.random()<.5;
 const count=cluster?2+rnd(3):1;
 const horiz=Math.random()<.5;
 for(let attempt=0;attempt<40;attempt++){
  const sx=rnd(G-(horiz?count-1:0));
  const sy=rnd(G-(horiz?0:count-1));
  const cells=[];
  for(let i=0;i<count;i++)cells.push({x:sx+(horiz?i:0),y:sy+(horiz?0:i),tied:count>1,h:horiz});
  let ok=true;
  for(const c of cells){
   if(snake.some(s=>s.x==c.x&&s.y==c.y)){ok=false;break}
   if(people.some(p=>p.x==c.x&&p.y==c.y)){ok=false;break}
  }
  if(ok){people.push(...cells);return}
 }
}

function step(){
 if(nd.x!=-dir.x||nd.y!=-dir.y)dir=nd;
 const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 // hidden ending 1: smash through left wall right next to the lever person
 if(h.x<0 && SECRET_WALL_ROWS.includes(h.y)){
  alive=false;
  const total=score+moralScore();
  showEndOvr('???',
   '【隐藏结局：弑己】\n你冲出轨道，撞向了\n那个一直在拉杆的自己\n再没人能控制电车了\n总分 '+total);
  return;
 }
 // wall / self collision
 if(h.x<0||h.y<0||h.x>=G||h.y>=G||snake.slice(0,-1).some(s=>s.x==h.x&&s.y==h.y)){
  alive=false;
  if(moralMode){
   const sec=Math.floor((now()-moralStart)/1000);
   showEndOvr('GAME OVER','道德高尚 '+sec+' 秒\n撞墙了\n总分 '+(score+moralScore()));
  }else{
   const verdict=score<5?'新手扳道工':score<15?'冷血驾驶员':score<30?'功利主义信徒':'电车难题大师';
   showEndOvr('GAME OVER','撞死 '+score+' 个人\n'+verdict);
  }
  return;
 }
 snake.unshift(h);
 // person collision (only if solid)
 const idx=people.findIndex(p=>p.x===h.x&&p.y===h.y&&ghostSolid(p));
 if(idx>=0){
  if(moralMode){
   // hidden ending 2 fail: hit a person while ascended
   alive=false;
   const sec=Math.floor((now()-moralStart)/1000);
   showEndOvr('道德破产',
    '【隐藏结局：堕落】\n坚持 '+sec+' 秒后还是没忍住\n总分 '+(score+moralScore()));
   return;
  }
  people.splice(idx,1);
  combo++;
  score+=combo;
  for(let i=1;i<combo;i++)snake.push({...snake[snake.length-1]});
  lastHitTime=now();
  if(people.length<3)spawnGroup();
  if(Math.random()<.25)spawnGroup();
 }else{
  snake.pop();
  combo=0;
 }
 // moral mode trigger
 if(!moralMode && now()-lastHitTime>MORAL_TRIGGER_MS) enterMoralMode();
}

function moralTick(){
 if(!moralMode||!alive)return;
 reapGhosts();
 // spawn rate ramps up over time
 const age=(now()-moralStart)/1000;
 const interval=Math.max(350, 1400 - age*25);
 if(now()-lastGhostSpawn > interval){
  spawnGhostPerson();
  lastGhostSpawn=now();
 }
}

function drawSprite(ctx,img,cx,cy,w,h,rot){
 ctx.save();
 ctx.translate(cx,cy);
 if(rot)ctx.rotate(rot);
 ctx.drawImage(img,-w/2,-h/2,w,h);
 ctx.restore();
}

function segDir(i){
 // direction this segment is moving toward
 if(i===0)return dir;
 const a=snake[i-1], b=snake[i];
 return {x:Math.sign(a.x-b.x), y:Math.sign(a.y-b.y)};
}

function drawSnake(){
 // back to front so head sits on top
 for(let i=snake.length-1;i>=0;i--){
  const s=snake[i];
  let sd=segDir(i);
  if(sd.x===0&&sd.y===0)sd=dir;
  const cx=s.x*S+S/2, cy=s.y*S+S/2;
  if(sd.y!==0){
   // vertical motion → top-down sprite, rotated
   const rot=sd.y>0?Math.PI/2:-Math.PI/2;
   drawSprite(X,IMG.trolley,cx,cy,S*1.1,S*0.92,rot);
  }else{
   // horizontal motion → side view, flipped when going left
   const flipX=sd.x<0?-1:1;
   X.save();
   X.translate(cx,cy);
   X.scale(flipX,1);
   const w=S*1.1, h=S*0.95;
   X.drawImage(IMG.side,-w/2,-h/2,w,h);
   X.restore();
  }
 }
 // driver dot at head
 const head=snake[0];
 const hx=head.x*S+S/2, hy=head.y*S+S/2;
 X.fillStyle='#c00';
 X.beginPath();
 X.arc(hx+dir.x*S*0.25, hy+dir.y*S*0.25, 2.5, 0, Math.PI*2);
 X.fill();
}

function draw(){
 // moral mode tinted background
 X.fillStyle=moralMode?'#f8f4e8':'#fff';X.fillRect(0,0,C.width,C.height);
 // tracks (subtle)
 X.strokeStyle='#ddd';X.lineWidth=1;
 for(let y=0;y<G;y++){
  X.beginPath();X.moveTo(0,y*S+S*0.3);X.lineTo(C.width,y*S+S*0.3);X.stroke();
  X.beginPath();X.moveTo(0,y*S+S*0.7);X.lineTo(C.width,y*S+S*0.7);X.stroke();
 }
 X.fillStyle='#eee';
 for(let y=0;y<G;y++)for(let x=0;x<G;x+=2){
  X.fillRect(x*S+S*0.15,y*S+S*0.25,S*0.25,S*0.5);
 }
 // people (with optional ghost alpha)
 if(IMG.single)people.forEach(p=>{
  const cx=p.x*S+S/2, cy=p.y*S+S/2;
  X.save();
  X.globalAlpha=ghostAlpha(p);
  drawSprite(X,IMG.single,cx,cy,S*0.5,S*0.95,0);
  X.restore();
 });
 if(IMG.trolley)drawSnake();
 // countdown overlay
 if(countdown>0){
  X.save();
  X.fillStyle='rgba(255,255,255,0.55)';
  X.fillRect(0,0,C.width,C.height);
  X.fillStyle='#c00';
  X.font='bold 110px monospace';
  X.textAlign='center';X.textBaseline='middle';
  const text=countdown===4?'GO!':String(countdown);
  X.fillText(text,C.width/2,C.height/2);
  X.restore();
 }
 // moral mode banner overlay
 if(moralMode){
  X.fillStyle='rgba(180,140,40,.85)';
  X.fillRect(0,0,C.width,18);
  X.fillStyle='#fff';
  X.font='bold 11px monospace';
  X.textAlign='center';
  X.fillText('道 德 高 尚 模 式  MORAL',C.width/2,13);
 }
 // HUD
 const total=score+moralScore();
 const moralPart=moralMode?' [道德 +'+moralScore()+']':'';
 const comboPart=combo>1?' x'+combo:'';
 document.getElementById('hud').innerText='SCORE '+String(total).padStart(4,'0')+comboPart+moralPart;
 drawLever();
}

function drawLever(){
 LX.fillStyle='#fff';LX.fillRect(0,0,LC.width,LC.height);
 if(IMG.lever){
  // direction → flip/rotate the lever person sprite
  const k=nd.x+','+nd.y;
  LX.save();
  LX.translate(LC.width/2, (LC.height-14)/2);
  // base sprite has lever pointing left (toward lower-left of frame)
  // map directions to slight rotations + flips
  let flipX=1, rot=0;
  if(k==='1,0'){ flipX=-1; rot=0; }       // facing right: mirror
  else if(k==='-1,0'){ flipX=1; rot=0; }   // facing left: original
  else if(k==='0,-1'){ flipX=1; rot=-0.25; } // up: tilt back
  else if(k==='0,1'){  flipX=1; rot=0.25; }  // down: tilt forward
  LX.scale(flipX,1);
  LX.rotate(rot);
  const w=LC.width*0.85, h=(LC.height-14)*0.95;
  LX.drawImage(IMG.lever,-w/2,-h/2,w,h);
  LX.restore();
 }
 // direction indicator at bottom
 const k=nd.x+','+nd.y;
 const arrow={'1,0':'→','-1,0':'←','0,-1':'↑','0,1':'↓'}[k]||'';
 LX.fillStyle='#000';
 LX.fillRect(0,LC.height-14,LC.width,14);
 LX.fillStyle='#fff';
 LX.font='bold 12px monospace';
 LX.textAlign='center';
 LX.fillText(arrow,LC.width/2,LC.height-3);
}

function showEndOvr(title,msg){
 const o=document.getElementById('ovr');
 o.classList.remove('meme');
 o.innerHTML='';
 const h=document.createElement('h1');h.textContent=title;o.appendChild(h);
 const p=document.createElement('p');p.textContent=msg;o.appendChild(p);
 const b=document.createElement('button');b.textContent='再来一次';b.onclick=ev=>{ev.stopPropagation();reset()};o.appendChild(b);
 o.classList.add('on');paused=true;
 o.onclick=null;
}
function hideOvr(){
 const o=document.getElementById('ovr');
 o.classList.remove('on');paused=false;
}

addEventListener('keydown',e=>{
 const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r',W:'u',S:'d',A:'l',D:'r'}[e.key];
 if(m){setDir(m);e.preventDefault()}
});
function setDir(k){
 const d={u:{x:0,y:-1},d:{x:0,y:1},l:{x:-1,y:0},r:{x:1,y:0}}[k];
 if(d&&(d.x!=-dir.x||d.y!=-dir.y))nd=d;
}
document.querySelectorAll('#pad button').forEach(b=>{
 b.addEventListener('touchstart',e=>{e.preventDefault();setDir(b.dataset.k)},{passive:false});
 b.addEventListener('click',()=>setDir(b.dataset.k));
});

document.getElementById('ovr').onclick=()=>{ if(!alive) reset() };

loadAll().then(()=>{
 function loop(){
  if(alive&&!paused){
   tick++;if(tick>=speed){step();tick=0}
   moralTick();
  }
  draw();
  requestAnimationFrame(loop);
 }
 loop();
});
</script>
